name: Website
on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/using/**', 'assets/logo/**', 'assets/fonts/**', 'assets/icons/**', 'assets/strings.tsv', 'src/firmware/**', 'src/common/video_sizes_okapia.*', 'tests/host/**', 'scripts/gen-*.py', '.gitmodules', 'external/stb', '.github/workflows/website.yml']
  pull_request:
    paths: ['site/**', 'docs/using/**', 'assets/logo/**', 'assets/fonts/**', 'assets/icons/**', 'assets/strings.tsv', 'src/firmware/**', 'src/common/video_sizes_okapia.*', 'tests/host/**', 'scripts/gen-*.py', '.gitmodules', 'external/stb', '.github/workflows/website.yml']
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Prepare the firmware renderer
        working-directory: .
        run: |
          git submodule update --init external/stb
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm test
      - run: npm run release
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run build
      - run: npm run check-links
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'release')
        with:
          path: site/dist
  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'release')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
